<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EU PONKALA - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid #eef2f6;
        }
        .login-container .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .login-container .logo span { color: #f5a623; }
        .login-container .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 32px;
        }
        .login-container .form-group { margin-bottom: 18px; }
        .login-container .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .login-container .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #eef2f6;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.2s;
            background: #f8f9fa;
        }
        .login-container .form-group input:focus {
            outline: none;
            border-color: #f5a623;
            background: white;
            box-shadow: 0 0 0 3px rgba(245,166,35,0.08);
        }
        .login-container .form-group .input-group { position: relative; }
        .login-container .form-group .input-group input { padding-right: 48px; }
        .login-container .form-group .input-group .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
        }
        .login-container .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .login-container .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            cursor: pointer;
        }
        .login-container .form-options a {
            color: #f5a623;
            text-decoration: none;
            font-weight: 500;
        }
        .login-container .form-options a:hover { text-decoration: underline; }
        .login-container .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #f5a623;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .login-container .btn-login:hover {
            background: #d4951f;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(245,166,35,0.3);
        }
        .login-container .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-container .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .login-container .error-msg.show { display: block; }
        .login-container .success-msg {
            background: #d1fae5;
            color: #059669;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .login-container .success-msg.show { display: block; }
        .login-container .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6b7280;
        }
        .login-container .register-link a {
            color: #f5a623;
            text-decoration: none;
            font-weight: 600;
        }
        .login-container .register-link a:hover { text-decoration: underline; }
        .login-container .hint {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.7;
        }
        .login-container .hint strong { color: #6b7280; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">EU <span>PONKALA</span></div>
        <p class="subtitle">Welcome back! Sign in to continue.</p>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Enter your password" required />
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-options">
                <label><input type="checkbox" checked /> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <p class="register-link">
            Don't have an account? <a href="/register">Sign up</a>
        </p>

        
    </div>

    <script>
        // ─── SESSION GUARD: if already logged in, redirect ───
        (function() {
            const token = localStorage.getItem('token');
            const user  = JSON.parse(localStorage.getItem('user') || 'null');
            if (token && user) {
                if (user.user_type === 'student')      window.location.href = '/student';
                else if (user.user_type === 'landlord') window.location.href = '/landlord';
                else if (user.user_type === 'admin')    window.location.href = '/admin';
            }
        })();

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.className = 'error-msg show';
            setTimeout(() => el.className = 'error-msg', 5000);
        }
        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.className = 'success-msg show';
            setTimeout(() => el.className = 'success-msg', 5000);
        }

        async function handleLogin(e) {
            e.preventDefault();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('loginBtn');

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    const token = data.data?.token || data.token;
                    const user  = data.data?.user  || data.user;

                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(user));

                    showSuccess('Login successful! Redirecting...');

                    setTimeout(() => {
                        if (user.user_type === 'student')      window.location.href = '/student';
                        else if (user.user_type === 'landlord') window.location.href = '/landlord';
                        else if (user.user_type === 'admin')    window.location.href = '/admin';
                        else                                    window.location.href = '/';
                    }, 1000);

                } else {
                    showError(data.message || 'Login failed');
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }

            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please check your connection.');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }
    </script>

</body>
</html>
